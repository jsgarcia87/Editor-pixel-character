<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taskoria — Character Editor 64×64</title>

    <style>
        :root {
            --bg: #15191c;
            --panel: #232a2f;
            --panel-dark: #1b2024;
            --border: #39434a;
            --text: #edf1f3;
            --muted: #9da8ae;
            --accent: #d86d50;
            --accent-hover: #b9573d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Segoe UI, Arial, sans-serif;

            display: grid;
            grid-template-columns: minmax(520px, 1fr) 380px;
            gap: 18px;

            padding: 18px;
        }

        .stage {
            min-width: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;

            padding: 20px;
        }

        canvas {
            width: min(82vh, 760px);
            height: min(82vh, 760px);

            image-rendering: pixelated;

            background:
                linear-gradient(45deg, #273036 25%, transparent 25%),
                linear-gradient(-45deg, #273036 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #273036 75%),
                linear-gradient(-45deg, transparent 75%, #273036 75%);

            background-size: 16px 16px;
            background-position:
                0 0,
                0 8px,
                8px -8px,
                -8px 0;

            border: 2px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);

            cursor: crosshair;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;

            padding: 16px;

            overflow-y: auto;
        }

        h1 {
            font-size: 19px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 16px;
        }

        .group {
            background: var(--panel-dark);
            border: 1px solid var(--border);
            border-radius: 8px;

            padding: 12px;
            margin-bottom: 12px;
        }

        .group h3 {
            color: var(--muted);

            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;

            margin-bottom: 9px;
        }

        select,
        button,
        textarea {
            font-family: inherit;
        }

        select,
        button {
            width: 100%;

            padding: 10px;

            border-radius: 6px;
            border: 1px solid var(--border);

            background: #2b343a;
            color: var(--text);
        }

        button {
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background: #364149;
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        button.primary:hover {
            background: var(--accent-hover);
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .swatch {
            width: 31px;
            height: 31px;

            border-radius: 5px;
            border: 2px solid rgba(255, 255, 255, .12);

            cursor: pointer;
        }

        .swatch.active {
            border-color: white;

            box-shadow:
                0 0 0 2px var(--accent),
                0 0 10px rgba(255, 255, 255, .2);
        }

        .info {
            font-size: 12px;
            line-height: 1.55;
            color: #cbd3d7;
        }

        .info strong {
            color: white;
        }

        .tag {
            display: inline-block;

            padding: 3px 6px;
            margin-top: 5px;

            border-radius: 4px;
            border: 1px solid var(--border);

            color: #cbd3d7;
            font-size: 11px;
        }

        textarea {
            width: 100%;
            height: 190px;

            margin-top: 10px;

            resize: vertical;

            background: #101416;
            color: #b9c5ca;

            border: 1px solid var(--border);
            border-radius: 6px;

            padding: 9px;

            font-family: monospace;
            font-size: 11px;
        }

        .status {
            margin-top: 9px;

            font-size: 11px;
            color: var(--muted);
        }

        @media(max-width:900px) {
            body {
                grid-template-columns: 1fr;
            }

            canvas {
                width: 75vw;
                height: 75vw;
            }
        }
    </style>
</head>

        /* =========================================================
           UTILIDADES PIXEL
        ========================================================= */

        function blankGrid() {

            return Array.from(
                { length: SIZE },
                () => Array(SIZE).fill(" ")
            );

        }


        function cloneGrid(grid) {
            return grid.map(
                row => Array.isArray(row) ? row.slice() : row.split('')
            );
        }


        function cloneLayers(layers) {

            return {

                cape:
                    layers.cape ? cloneGrid(layers.cape) : blankGrid(),
                base_body:
                    cloneGrid(layers.base_body),
                arms:
                    layers.arms ? cloneGrid(layers.arms) : blankGrid(),
                legs:
                    cloneGrid(layers.legs),
                torso:
                    cloneGrid(layers.torso),
                hair:
                    layers.hair ? cloneGrid(layers.hair) : blankGrid(),
                head:
                    cloneGrid(layers.head),
                weapon:
                    cloneGrid(layers.weapon)

            };

        }


        function pixel(grid, x, y, color) {

            if (
                x < 0 ||
                x >= SIZE ||
                y < 0 ||
                y >= SIZE
            ) return;

            grid[y][x] = color;

        }


        function rect(
            grid,
            x,
            y,
            width,
            height,
            color
        ) {

            for (
                let yy = y;
                yy < y + height;
                yy++
            ) {

                for (
                    let xx = x;
                    xx < x + width;
                    xx++
                ) {

                    pixel(
                        grid,
                        xx,
                        yy,
                        color
                    );

                }

            }

        }


        function line(
            grid,
            x1,
            y1,
            x2,
            y2,
            color,
            thickness = 1
        ) {

            let dx =
                Math.abs(x2 - x1);

            let sx =
                x1 < x2 ? 1 : -1;

            let dy =
                -Math.abs(y2 - y1);

            let sy =
                y1 < y2 ? 1 : -1;

            let error =
                dx + dy;

            while (true) {

                for (
                    let yy = -Math.floor(thickness / 2);
                    yy <= Math.floor(thickness / 2);
                    yy++
                ) {

                    for (
                        let xx = -Math.floor(thickness / 2);
                        xx <= Math.floor(thickness / 2);
                        xx++
                    ) {

                        pixel(
                            grid,
                            x1 + xx,
                            y1 + yy,
                            color
                        );

                    }

                }

                if (
                    x1 === x2 &&
                    y1 === y2
                ) break;

                const e2 = 2 * error;

                if (e2 >= dy) {

                    error += dy;
                    x1 += sx;

                }

                if (e2 <= dx) {

                    error += dx;
                    y1 += sy;

                }

            }

        }


        function ellipse(
            grid,
            cx,
            cy,
            rx,
            ry,
            color
        ) {

            for (
                let y = cy - ry;
                y <= cy + ry;
                y++
            ) {

                for (
                    let x = cx - rx;
                    x <= cx + rx;
                    x++
                ) {

                    const value =
                        ((x - cx) ** 2) / (rx ** 2) +
                        ((y - cy) ** 2) / (ry ** 2);

                    if (value <= 1) {

                        pixel(
                            grid,
                            x,
                            y,
                            color
                        );

                    }

                }

            }

        }


        /* =========================================================
           CUERPO BASE
        ========================================================= */

        function createBaseBody() {

            const g = blankGrid();


            /* cabeza */

            ellipse(
                g,
                32,
                19,
                5,
                5,
                "D"
            );


            /* cuello */

            rect(
                g,
                29,
                24,
                6,
                6,
                "D"
            );


            /* torso */

            rect(
                g,
                26,
                29,
                12,
                14,
                "D"
            );


            /* piernas */

            rect(
                g,
                27,
                42,
                4,
                10,
                "D"
            );

            rect(
                g,
                33,
                42,
                4,
                10,
                "D"
            );


            /* pies */

            rect(
                g,
                26,
                51,
                6,
                3,
                "A"
            );

            rect(
                g,
                32,
                51,
                6,
                3,
                "A"
            );


            /* cara */

            pixel(g, 29, 19, "A");
            pixel(g, 34, 19, "A");

            pixel(g, 32, 22, "E");


            return g;

        }


        /* =========================================================
           CONSTRUCTOR DE PERSONAJES
        ========================================================= */

        function createCharacter(id) {

            const layers = {

            /* =====================================================
               SCOUT

                );

                /* gorra */

                rect(

                    27, 14,

                );

                /* mochila */

                rect(
                    armor,
                    23, 31,
                    3, 10,
                    "R"
                );

                /* espada */

                line(
                    weapon,
                    40, 29,
                    48, 48,
                    "A",
                    2
                );

                line(
                    weapon,
                    37, 31,
                    43, 31,

                );

            /* =====================================================

        /* =========================================================
           RENDER
        ========================================================= */

        function render() {

            ctx.clearRect(
                0,
                0,
                CANVAS_SIZE,
                CANVAS_SIZE
            );


            /* fondo */

            ctx.fillStyle =
                "#20282d";

            ctx.fillRect(
                0,
                0,
                CANVAS_SIZE,
                CANVAS_SIZE
            );


            const renderOrder = [

                "cape",
                "base_body",
                "arms",
                "legs",
                "torso",
                "hair",
                "head",
                "weapon"

            ];


            /* Modo calco: solo se pinta el cuerpo base (a opacidad reducida)
               y la capa que se está editando. El resto se oculta para no
               competir visualmente con el trazo. Si la capa editada ES el
               cuerpo base, el calco no aplica (se ve todo normal). */

            const isCalco = calcoMode && currentLayer !== "base_body";


            renderOrder.forEach(
                layerName => {

                    if (isCalco) {
                        if (layerName !== "base_body" && layerName !== currentLayer) return;
                    }

                    const grid =
                        layers[layerName];

                    const dim = isCalco && layerName === "base_body";
                    ctx.globalAlpha = dim ? calcoOpacity : 1;

                    for (
                        let y = 0;
                        y < SIZE;
                        y++
                    ) {

                        for (
                            let x = 0;
                            x < SIZE;
                            x++
                        ) {

                            const colorKey =
                                grid[y][x];

                            if (
                                colorKey === " " || colorKey === "transparent"
                            ) continue;

                            let color =
                                PALETTE[
                                colorKey
                                ];

                            if (!color && colorKey && colorKey.startsWith("#")) {
                                color = colorKey;
                            }

                            if (!color) continue;

                            ctx.fillStyle =
                                color;

                            ctx.fillRect(
                                x * SCALE,
                                y * SCALE,
                                SCALE,
                                SCALE
                            );

                        }

                    }

                }
            );

            ctx.globalAlpha = 1;

        }


        /* =========================================================
           PINTADO
        ========================================================= */

        function getPixelPosition(event) {

            const rect =
                canvas.getBoundingClientRect();

            return [

                Math.floor(
                    (
                        event.clientX -
                        rect.left
                    )
                    /
                    rect.width
                    *
                    SIZE
                ),

                Math.floor(
                    (
                        event.clientY -
                        rect.top
                    )
                    /
                    rect.height
                    *
                    SIZE
                )

            ];

        }


        function paint(event) {

            const [
                x,
                y
            ] =
                getPixelPosition(event);


            if (
                x < 0 ||
                y < 0 ||
                x >= SIZE ||
                y >= SIZE
            ) return;


            const grid =
                layers[currentLayer];


            if (
                currentTool ===
                "brush"
            ) {

                grid[y][x] =
                    currentColor;

                render();

            }


            if (
                currentTool ===
                "fill"
            ) {

                floodFill(
                    x,
                    y,
                    grid[y][x],
                    currentColor,
                    grid
                );

                render();

            }

        }


        function floodFill(
            startX,
            startY,
            target,
            replacement,
            grid
        ) {

            if (
                target === replacement
            ) return;


            const queue = [

                [startX, startY]

            ];


            let index = 0;


            while (
                index < queue.length
            ) {

                const [
                    x,
                    y
                ] =
                    queue[index++];


                if (
                    x < 0 ||
                    y < 0 ||
                    x >= SIZE ||
                    y >= SIZE
                ) continue;


                if (
                    grid[y][x] !== target
                ) continue;


                grid[y][x] =
                    replacement;


                queue.push(
                    [x + 1, y],
                    [x - 1, y],
                    [x, y + 1],
                    [x, y - 1]
                );

            }

        }


        /* =========================================================
           INPUT
        ========================================================= */

        let drawing = false;


        canvas.addEventListener(
            "mousedown",
            event => {

                drawing = true;

                paint(event);

            }
        );


        canvas.addEventListener(
            "mousemove",
            event => {

                if (
                    drawing &&
                    currentTool === "brush"
                ) {

                    paint(event);

                }

            }
        );


        window.addEventListener(
            "mouseup",
            () => {

                drawing = false;

            }
        );


        /* =========================================================
           CAMBIO DE PERSONAJE
        ========================================================= */

        characterSelect.addEventListener(
            "change",
            event => {
                currentCharacter = event.target.value;
                updateEquipmentDropdowns();
                buildAvatar();
                currentLayer = "base_body";
                layerSelect.value = currentLayer;
                updateInfo();
                render();
            }
        );

        genderSelect.addEventListener(
            "change",
            event => {

                currentGender =
                    event.target.value;

                buildAvatar();

                render();

            }
        );


        /* =========================================================
           CAMBIO DE CAPA
        ========================================================= */

        layerSelect.addEventListener(
            "change",
            event => {

                currentLayer =
                    event.target.value;

                render();

            }
        );


        /* =========================================================
           MODO CALCO
        ========================================================= */

        const calcoToggle = document.getElementById("calcoToggle");
        const calcoOpacityInput = document.getElementById("calcoOpacity");
        const calcoOpacityLabel = document.getElementById("calcoOpacityLabel");

        calcoToggle.addEventListener("change", event => {
            calcoMode = event.target.checked;
            render();
        });

        calcoOpacityInput.addEventListener("input", event => {
            calcoOpacity = Number(event.target.value) / 100;
            calcoOpacityLabel.textContent = event.target.value + "%";
            if (calcoMode) render();
        });


        /* =========================================================
           HERRAMIENTAS
        ========================================================= */

        document
            .getElementById("brushButton")
            .onclick = () => {

                currentTool =
                    "brush";

                document
                    .getElementById(
                        "brushButton"
                    )
                    .classList.add(
                        "primary"
                    );

                document
                    .getElementById(
                        "fillButton"
                    )
                    .classList.remove(
                        "primary"
                    );

            };


        document
            .getElementById("fillButton")
            .onclick = () => {

                currentTool =
                    "fill";

                document
                    .getElementById(
                        "fillButton"
                    )
                    .classList.add(
                        "primary"
                    );

                document
                    .getElementById(
                        "brushButton"
                    )
                    .classList.remove(
                        "primary"
                    );

            };


        /* =========================================================
           RESTAURAR
        ========================================================= */

        function restoreCharacter() {

            buildAvatar();
            render();

        }


        /* =========================================================
           VALIDACIÓN
        ========================================================= */

        function validateGrid(
            grid,
            layerName
        ) {

            if (
                !Array.isArray(grid)
            ) {

                throw new Error(
                    layerName +
                    ": no es una matriz."
                );

            }


            if (
                grid.length !== 64
            ) {

                throw new Error(
                    layerName +
                    ": debe tener 64 filas."
                );

            }


            grid.forEach(
                (row, index) => {

                    if (
                        row.length !== 64
                    ) {

                        throw new Error(
                            layerName +
                            ": fila " +
                            index +
                            " no tiene 64 píxeles."
                        );

                    }

                }
            );

        }


        /* =========================================================
           EXPORT JSON
        ========================================================= */

        function exportJSON() {

            const payload = {

                palette:
                    PALETTE,

                layers: {}

            };


            Object.entries(layers)
                .forEach(
                    ([layerName, grid]) => {

                        validateGrid(
                            grid,
                            layerName
                        );

                        payload.layers[
                            layerName
                        ] =
                            grid.map(
                                row =>
                                    row.join("")
                            );

                    }
                );


            const json = {

                name:
                    currentCharacter,

                category:
                    "characters",

                payload:

                    payload

            };


            output.value =
                JSON.stringify(
                    json,
                    null,
                    2
                );

        }


        /* =========================================================
           COPIAR
        ========================================================= */

        function exportLayerJSON() {
            const payload = {
                palette: PALETTE,
                layer: currentLayer,
                grid: layers[currentLayer].map(row => row.join(""))
            };

            const json = {
                name: currentCharacter + "_" + currentLayer,
                category: "equipment",
                payload: payload
            };

            output.value = JSON.stringify(json, null, 2);
        }

        function copyLayerJSON() {
            exportLayerJSON();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(output.value);
            }
        }

        function copyJSON() {

            exportJSON();

            if (
                navigator.clipboard
            ) {

                navigator.clipboard
                    .writeText(
                        output.value
                    );

            }

        }


        /* =========================================================
           INIT
        ========================================================= */

        buildPalette();

        updateInfo();

        render();

    </script>

</body>

</html>
